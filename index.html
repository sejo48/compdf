<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DocScan Pro - Jorge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
            background-color: #020617;
            touch-action: none;
        }
        .app-container {
            height: 100vh;
            height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
        }
        .corner-handle { 
            width: 50px; height: 50px; 
            background: rgba(16, 185, 129, 0.7); 
            border: 4px solid white; 
            border-radius: 50%; 
            position: absolute; 
            pointer-events: auto;
            transform: translate(-50%, -50%); 
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
            z-index: 100; 
            touch-action: none;
        }
        .corner-handle:active {
            background: rgba(16, 185, 129, 1);
            scale: 1.2;
        }
        #video-container {
            flex: 1;
            min-height: 0;
            position: relative;
            background: #000;
        }
    </style>
</head>
<body class="text-slate-100 font-sans">

    <div class="app-container">
        <!-- Encabezado -->
        <header class="p-3 border-b border-slate-800 flex justify-between items-center bg-slate-900 shrink-0">
            <div class="flex items-center gap-2">
                <div class="bg-emerald-500 p-1.5 rounded-lg text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                </div>
                <h1 class="text-lg font-bold">DocScan Pro</h1>
            </div>
            <div id="page-counter" class="text-xs font-mono bg-slate-800 px-3 py-1 rounded-full border border-slate-700">0 PÁGS</div>
        </header>

        <!-- Visor de Cámara / Editor -->
        <main id="video-container">
            <video id="video" autoplay playsinline class="w-full h-full object-contain"></video>
            
            <!-- Capa de Edición -->
            <div id="edit-layer" class="hidden absolute inset-0 bg-black flex items-center justify-center">
                <div id="canvas-wrapper" class="relative inline-block">
                    <canvas id="edit-canvas" class="max-w-full max-h-full block"></canvas>
                    <div id="handles-container" class="absolute inset-0 pointer-events-none">
                        <!-- Puntos fijos que no se borran al mover -->
                        <div id="h0" class="corner-handle"></div>
                        <div id="h1" class="corner-handle"></div>
                        <div id="h2" class="corner-handle"></div>
                        <div id="h3" class="corner-handle"></div>
                    </div>
                    <svg class="absolute inset-0 w-full h-full pointer-events-none">
                        <polygon id="poly-guide" points="" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="3" />
                    </svg>
                </div>
            </div>

            <div id="tap-hint" class="hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/60 px-6 py-3 rounded-2xl text-sm font-bold animate-pulse text-center">
                TOCA LA PANTALLA<br>PARA ESCANEAR
            </div>

            <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 bg-slate-900">
                <p>Iniciando sistema para Jorge...</p>
            </div>
        </main>

        <!-- Controles Inferiores -->
        <footer class="bg-slate-900 border-t border-slate-800 p-4 shrink-0 shadow-2xl">
            <div class="max-w-md mx-auto flex flex-col gap-4">
                
                <div id="camera-controls">
                    <button id="start-btn" class="bg-white text-slate-900 px-8 py-3 rounded-xl font-bold w-full active:scale-95">Encender Cámara</button>
                </div>

                <div id="edit-controls" class="hidden flex flex-col gap-3">
                    <div class="grid grid-cols-2 gap-2">
                        <button id="auto-detect-btn" class="bg-blue-600 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2">
                            <span>Auto-Detectar</span>
                        </button>
                        <button id="confirm-warp-btn" class="bg-emerald-500 text-white py-3 rounded-xl font-bold">Aplanar y Añadir</button>
                    </div>
                    <button id="cancel-edit-btn" class="bg-slate-800 text-slate-400 py-2 rounded-lg font-bold text-sm">Descartar Toma</button>
                </div>

                <div class="flex items-center justify-between border-t border-slate-800 pt-3">
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="filter-bw" class="w-5 h-5 accent-emerald-500" checked>
                        <label for="filter-bw" class="text-xs font-bold text-slate-400">Blanco y Negro</label>
                    </div>
                    <div class="flex gap-2">
                        <button id="reset-btn" class="text-[10px] font-bold text-rose-500 uppercase px-2">Limpiar</button>
                        <button id="generate-btn" disabled class="bg-slate-800 text-slate-500 px-4 py-2 rounded-lg text-xs font-bold">Bajar PDF</button>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script>
        const { jsPDF } = window.jspdf;
        const video = document.getElementById('video');
        const videoContainer = document.getElementById('video-container');
        const editLayer = document.getElementById('edit-layer');
        const editCanvas = document.getElementById('edit-canvas');
        const polyGuide = document.getElementById('poly-guide');
        const startBtn = document.getElementById('start-btn');
        const tapHint = document.getElementById('tap-hint');
        const autoDetectBtn = document.getElementById('auto-detect-btn');
        const confirmWarpBtn = document.getElementById('confirm-warp-btn');
        const cancelEditBtn = document.getElementById('cancel-edit-btn');
        const generateBtn = document.getElementById('generate-btn');

        let pages = [];
        let stream = null;
        let capturedImage = null;
        let corners = []; 
        let isEditing = false;

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } 
                });
                video.srcObject = stream;
                document.getElementById('placeholder').classList.add('hidden');
                startBtn.parentElement.classList.add('hidden');
                tapHint.classList.remove('hidden');
            } catch (err) { alert("Jorge, por favor permite el acceso a la cámara."); }
        }

        function captureToEdit() {
            if (isEditing || !stream) return;
            isEditing = true;

            const temp = document.createElement('canvas');
            temp.width = video.videoWidth;
            temp.height = video.videoHeight;
            temp.getContext('2d').drawImage(video, 0, 0);
            capturedImage = temp;

            showEditor();
        }

        videoContainer.onclick = (e) => {
            if (!isEditing && (e.target === video || e.target === tapHint || e.target === videoContainer)) {
                captureToEdit();
            }
        };

        function showEditor() {
            editLayer.classList.remove('hidden');
            tapHint.classList.add('hidden');
            document.getElementById('edit-controls').classList.remove('hidden');

            editCanvas.width = capturedImage.width;
            editCanvas.height = capturedImage.height;
            editCanvas.getContext('2d').drawImage(capturedImage, 0, 0);

            const w = editCanvas.width;
            const h = editCanvas.height;
            // Posición inicial estándar
            corners = [
                { x: w*0.15, y: h*0.15 }, { x: w*0.85, y: h*0.15 },
                { x: w*0.85, y: h*0.85 }, { x: w*0.15, y: h*0.85 }
            ];
            
            setupHandles();
            autoDetect();
            updateUI();
        }

        // Detección automática de Jorge: busca el cuadro con más brillo (papel)
        function autoDetect() {
            const ctx = editCanvas.getContext('2d');
            const data = ctx.getImageData(0, 0, editCanvas.width, editCanvas.height).data;
            const w = editCanvas.width;
            const h = editCanvas.height;
            
            let minX = w, maxX = 0, minY = h, maxY = 0;
            let count = 0;

            for (let y = 0; y < h; y += 15) {
                for (let x = 0; x < w; x += 15) {
                    const i = (y * w + x) * 4;
                    const brightness = (data[i] + data[i+1] + data[i+2]) / 3;
                    if (brightness > 150) { // Color de papel
                        if (x < minX) minX = x; if (x > maxX) maxX = x;
                        if (y < minY) minY = y; if (y > maxY) maxY = y;
                        count++;
                    }
                }
            }

            if (count > 100) { // Si detectamos algo que parece papel
                corners = [
                    { x: minX, y: minY }, { x: maxX, y: minY },
                    { x: maxX, y: maxY }, { x: minX, y: maxY }
                ];
                updateUI();
            }
        }

        function setupHandles() {
            for (let i = 0; i < 4; i++) {
                const h = document.getElementById(`h${i}`);
                h.onpointerdown = (e) => {
                    h.setPointerCapture(e.pointerId);
                    const moveHandler = (pe) => {
                        const rect = editCanvas.getBoundingClientRect();
                        const scaleX = rect.width / editCanvas.width;
                        const scaleY = rect.height / editCanvas.height;
                        
                        corners[i].x = Math.max(0, Math.min(editCanvas.width, (pe.clientX - rect.left) / scaleX));
                        corners[i].y = Math.max(0, Math.min(editCanvas.height, (pe.clientY - rect.top) / scaleY));
                        updateUI();
                    };
                    h.onpointermove = moveHandler;
                    h.onpointerup = () => {
                        h.onpointermove = null;
                        h.releasePointerCapture(e.pointerId);
                    };
                };
            }
        }

        function updateUI() {
            const rect = editCanvas.getBoundingClientRect();
            const scaleX = rect.width / editCanvas.width;
            const scaleY = rect.height / editCanvas.height;

            let polyPoints = "";
            corners.forEach((c, i) => {
                const h = document.getElementById(`h${i}`);
                h.style.left = `${c.x * scaleX}px`;
                h.style.top = `${c.y * scaleY}px`;
                polyPoints += `${c.x * scaleX},${c.y * scaleY} `;
            });
            polyGuide.setAttribute('points', polyPoints);
        }

        function warpAndAdd() {
            // Dimensiones para alta calidad
            const outW = 1200; 
            const outH = 1650; 
            const canvas = document.createElement('canvas');
            canvas.width = outW; canvas.height = outH;
            const ctx = canvas.getContext('2d');

            // Recorte inteligente (Jorge, esto "aplana" el documento)
            ctx.drawImage(capturedImage, 
                corners[0].x, corners[0].y, 
                corners[1].x - corners[0].x, corners[3].y - corners[0].y, 
                0, 0, outW, outH
            );

            if (document.getElementById('filter-bw').checked) {
                const img = ctx.getImageData(0,0, outW, outH);
                const d = img.data;
                for (let i=0; i<d.length; i+=4) {
                    const g = d[i]*0.3 + d[i+1]*0.59 + d[i+2]*0.11;
                    const v = g > 135 ? 255 : (g < 75 ? 0 : g);
                    d[i] = d[i+1] = d[i+2] = v;
                }
                ctx.putImageData(img, 0, 0);
            }

            pages.push({ data: canvas.toDataURL('image/jpeg', 0.9), w: outW, h: outH });
            closeEditor();
            updateStats();
        }

        function closeEditor() {
            isEditing = false;
            editLayer.classList.add('hidden');
            tapHint.classList.remove('hidden');
            document.getElementById('edit-controls').classList.add('hidden');
        }

        function updateStats() {
            document.getElementById('page-counter').innerText = `${pages.length} PÁGS`;
            generateBtn.disabled = pages.length === 0;
            if (pages.length > 0) {
                generateBtn.classList.replace('bg-slate-800', 'bg-blue-600');
                generateBtn.classList.replace('text-slate-500', 'text-white');
            }
        }

        startBtn.onclick = startCamera;
        autoDetectBtn.onclick = autoDetect;
        confirmWarpBtn.onclick = warpAndAdd;
        cancelEditBtn.onclick = closeEditor;
        
        generateBtn.onclick = () => {
            const doc = new jsPDF('p', 'px', [pages[0].w, pages[0].h]);
            pages.forEach((p, i) => {
                if (i > 0) doc.addPage([p.w, p.h], 'p');
                doc.addImage(p.data, 'JPEG', 0, 0, p.w, p.h);
            });
            doc.save(`Escaneo_Jorge_${Date.now()}.pdf`);
        };

        document.getElementById('reset-btn').onclick = () => { if(confirm("¿Borrar todo?")) { pages = []; updateStats(); }};
        window.onresize = () => { if(isEditing) updateUI(); };
    </script>
</body>
</html>
