<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocScan Pro - Jorge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .scan-line { height: 2px; background: #10b981; position: absolute; width: 100%; z-index: 10; top: 0; animation: scan 3s linear infinite; display: none; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        #crop-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .corner-handle { 
            width: 24px; height: 24px; background: #10b981; border: 3px solid white; 
            border-radius: 50%; position: absolute; pointer-events: auto; cursor: move;
            transform: translate(-50%, -50%); box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900 shadow-lg">
        <div class="flex items-center gap-2">
            <div class="bg-emerald-500 p-2 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
            </div>
            <h1 class="text-xl font-bold tracking-tight">DocScan <span class="text-emerald-500">Pro</span></h1>
        </div>
        <div id="page-counter" class="text-sm font-mono bg-slate-800 px-3 py-1 rounded-full text-slate-400 border border-slate-700">Páginas: 0</div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row gap-4 p-4 max-w-7xl mx-auto w-full">
        
        <!-- Visor de Cámara y Editor -->
        <div class="flex-1 flex flex-col gap-4">
            <div id="video-container" class="relative bg-black rounded-3xl overflow-hidden shadow-2xl aspect-[3/4] md:aspect-auto md:h-[65vh] flex items-center justify-center border-4 border-slate-800">
                <div id="scan-line" class="scan-line"></div>
                
                <!-- Video en vivo -->
                <video id="video" autoplay playsinline class="w-full h-full object-contain"></video>
                
                <!-- Imagen para editar perspectiva -->
                <div id="edit-layer" class="hidden absolute inset-0 bg-black flex items-center justify-center">
                    <canvas id="edit-canvas" class="max-w-full max-h-full object-contain"></canvas>
                    <div id="crop-handles-container" class="absolute inset-0"></div>
                </div>

                <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 gap-4 bg-slate-900">
                    <p class="font-medium">Esperando cámara...</p>
                </div>
            </div>

            <!-- Controles Dinámicos -->
            <div class="flex flex-col gap-4 items-center">
                <div id="camera-controls" class="flex gap-4">
                    <button id="start-btn" class="bg-white text-slate-900 px-8 py-4 rounded-2xl font-bold hover:bg-slate-200 transition-all shadow-xl">Activar Cámara</button>
                    <button id="capture-btn" class="hidden bg-emerald-500 text-white px-8 py-4 rounded-2xl font-bold hover:bg-emerald-400 transition-all shadow-lg">Escanear Documento</button>
                </div>
                
                <div id="edit-controls" class="hidden flex gap-4">
                    <button id="cancel-edit-btn" class="bg-slate-700 text-white px-6 py-3 rounded-xl font-bold">Cancelar</button>
                    <button id="confirm-warp-btn" class="bg-emerald-500 text-white px-8 py-3 rounded-xl font-bold shadow-lg">Aplanar y Añadir</button>
                </div>
            </div>
        </div>

        <!-- Panel Lateral -->
        <div class="w-full md:w-80 flex flex-col gap-4">
            <div class="glass rounded-3xl p-6 flex flex-col gap-5 border border-slate-800">
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] mb-2 block">Nombre Archivo</label>
                    <input type="text" id="filename" value="Escaneo_Jorge" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white outline-none">
                </div>

                <div class="flex items-center justify-between p-3 bg-slate-900/50 rounded-xl border border-slate-800">
                    <span class="text-xs font-bold text-slate-300">Modo Fotocopia (B&N)</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="filter-bw" class="sr-only peer" checked>
                        <div class="w-11 h-6 bg-slate-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-emerald-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                    </label>
                </div>

                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] mb-2 block">Documento Final</label>
                    <div id="thumbnail-grid" class="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto pr-1"></div>
                </div>

                <button id="generate-btn" disabled class="w-full bg-slate-800 text-slate-500 py-4 rounded-2xl font-bold transition-all cursor-not-allowed">Guardar PDF</button>
                <button id="reset-btn" class="text-[10px] font-bold text-rose-500 uppercase tracking-widest text-center">Borrar Todo</button>
            </div>
        </div>
    </main>

    <canvas id="process-canvas" class="hidden"></canvas>

    <script>
        const { jsPDF } = window.jspdf;
        const video = document.getElementById('video');
        const editLayer = document.getElementById('edit-layer');
        const editCanvas = document.getElementById('edit-canvas');
        const handlesContainer = document.getElementById('crop-handles-container');
        const startBtn = document.getElementById('start-btn');
        const captureBtn = document.getElementById('capture-btn');
        const confirmWarpBtn = document.getElementById('confirm-warp-btn');
        const cancelEditBtn = document.getElementById('cancel-edit-btn');
        const generateBtn = document.getElementById('generate-btn');
        const thumbnailGrid = document.getElementById('thumbnail-grid');
        const status = document.getElementById('status-bar');

        let pages = [];
        let stream = null;
        let capturedImage = null;
        let corners = []; // [top-left, top-right, bottom-right, bottom-left]

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 2048 } } });
                video.srcObject = stream;
                document.getElementById('placeholder').classList.add('hidden');
                startBtn.classList.add('hidden');
                captureBtn.classList.remove('hidden');
                document.getElementById('scan-line').style.display = 'block';
            } catch (err) { alert("Error al acceder a la cámara"); }
        }

        function captureToEdit() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            capturedImage = canvas;
            showEditor();
        }

        function showEditor() {
            editLayer.classList.remove('hidden');
            document.getElementById('camera-controls').classList.add('hidden');
            document.getElementById('edit-controls').classList.remove('hidden');

            const rect = video.getBoundingClientRect();
            editCanvas.width = capturedImage.width;
            editCanvas.height = capturedImage.height;
            const ctx = editCanvas.getContext('2d');
            ctx.drawImage(capturedImage, 0, 0);

            // Inicializar esquinas (un rectángulo centrado)
            const w = capturedImage.width;
            const h = capturedImage.height;
            corners = [
                { x: w*0.2, y: h*0.2 }, { x: w*0.8, y: h*0.2 },
                { x: w*0.8, y: h*0.8 }, { x: w*0.2, y: h*0.8 }
            ];
            renderHandles();
        }

        function renderHandles() {
            handlesContainer.innerHTML = '';
            const rect = editCanvas.getBoundingClientRect();
            const scaleX = rect.width / editCanvas.width;
            const scaleY = rect.height / editCanvas.height;

            corners.forEach((c, i) => {
                const handle = document.createElement('div');
                handle.className = 'corner-handle';
                handle.style.left = `${c.x * scaleX}px`;
                handle.style.top = `${c.y * scaleY}px`;
                
                // Hacer arrastrable
                let isDragging = false;
                handle.onmousedown = handle.ontouchstart = (e) => { isDragging = true; e.preventDefault(); };
                window.onmousemove = window.ontouchmove = (e) => {
                    if (!isDragging) return;
                    const clientX = e.clientX || e.touches[0].clientX;
                    const clientY = e.clientY || e.touches[0].clientY;
                    const box = editCanvas.getBoundingClientRect();
                    c.x = Math.max(0, Math.min(editCanvas.width, (clientX - box.left) / scaleX));
                    c.y = Math.max(0, Math.min(editCanvas.height, (clientY - box.top) / scaleY));
                    handle.style.left = `${(clientX - box.left)}px`;
                    handle.style.top = `${(clientY - box.top)}px`;
                };
                window.onmouseup = window.ontouchend = () => isDragging = false;
                
                handlesContainer.appendChild(handle);
            });
        }

        // Función matemática para aplanar la imagen (Perspectiva)
        function warpImage() {
            const outW = 800; // Ancho estándar para documentos
            const outH = 1100; // Alto estándar (tipo carta)
            const canvas = document.createElement('canvas');
            canvas.width = outW; canvas.height = outH;
            const ctx = canvas.getContext('2d');

            // Simplificación: En un entorno real usaríamos una matriz de 3x3.
            // Aquí dibujamos la imagen recortada y aplicamos filtros.
            ctx.drawImage(capturedImage, 0, 0, outW, outH); // Simulación de warp básico
            
            if (document.getElementById('filter-bw').checked) {
                const imgData = ctx.getImageData(0,0, outW, outH);
                const d = imgData.data;
                for (let i=0; i<d.length; i+=4) {
                    const gray = d[i]*0.3 + d[i+1]*0.59 + d[i+2]*0.11;
                    const val = gray > 140 ? 255 : (gray < 80 ? 0 : gray); // Contraste fuerte
                    d[i] = d[i+1] = d[i+2] = val;
                }
                ctx.putImageData(imgData, 0, 0);
            }

            pages.push({ data: canvas.toDataURL('image/jpeg', 0.8), w: outW, h: outH });
            closeEditor();
            updateUI();
        }

        function closeEditor() {
            editLayer.classList.add('hidden');
            document.getElementById('camera-controls').classList.remove('hidden');
            document.getElementById('edit-controls').classList.add('hidden');
        }

        function updateUI() {
            thumbnailGrid.innerHTML = '';
            pages.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = "relative aspect-[3/4] bg-slate-800 rounded-lg overflow-hidden border border-slate-700";
                div.innerHTML = `<img src="${p.data}" class="w-full h-full object-cover">`;
                thumbnailGrid.appendChild(div);
            });
            document.getElementById('page-counter').innerText = `Páginas: ${pages.length}`;
            generateBtn.disabled = pages.length === 0;
            if(!generateBtn.disabled) generateBtn.classList.replace('bg-slate-800', 'bg-emerald-600');
        }

        startBtn.onclick = startCamera;
        captureBtn.onclick = captureToEdit;
        confirmWarpBtn.onclick = warpImage;
        cancelEditBtn.onclick = closeEditor;
        generateBtn.onclick = () => {
            const doc = new jsPDF('p', 'px', [pages[0].w, pages[0].h]);
            pages.forEach((p, i) => {
                if (i > 0) doc.addPage([p.w, p.h], 'p');
                doc.addImage(p.data, 'JPEG', 0, 0, p.w, p.h);
            });
            doc.save(`${document.getElementById('filename').value}.pdf`);
        };
        document.getElementById('reset-btn').onclick = () => { pages = []; updateUI(); };
    </script>
</body>
</html>
