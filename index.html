<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DocScan Pro - Jorge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background-color: #020617;
            display: flex;
            flex-direction: column;
            touch-action: none;
        }
        .app-header {
            height: 60px;
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            flex-shrink: 0;
        }
        .main-content {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
        }
        .app-footer {
            background: #0f172a;
            border-top: 1px solid #1e293b;
            padding: 15px;
            flex-shrink: 0;
            z-index: 1000;
        }
        .corner-handle { 
            width: 44px; height: 44px; 
            background: rgba(16, 185, 129, 0.8); 
            border: 3px solid white; 
            border-radius: 50%; 
            position: absolute; 
            pointer-events: auto;
            transform: translate(-50%, -50%); 
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            z-index: 200; 
            touch-action: none;
        }
        /* El wrapper del canvas limita el tamaño máximo para que no se salga */
        #canvas-wrapper {
            position: relative;
            display: inline-block;
            max-width: 95%;
            max-height: 95%;
        }
        #edit-canvas {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="flex items-center gap-2">
            <div class="bg-emerald-500 p-1 rounded-lg text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
            </div>
            <span class="font-bold text-white">DocScan Pro</span>
        </div>
        <div id="page-counter" class="text-xs font-mono bg-slate-800 px-3 py-1 rounded-full border border-slate-700 text-slate-300">0 PÁGS</div>
    </header>

    <main class="main-content" id="video-container">
        <video id="video" autoplay playsinline class="w-full h-full object-contain"></video>
        
        <!-- Capa de Edición -->
        <div id="edit-layer" class="hidden absolute inset-0 bg-black flex items-center justify-center p-4">
            <div id="canvas-wrapper">
                <canvas id="edit-canvas"></canvas>
                <div id="handles-container" class="absolute inset-0 pointer-events-none">
                    <div id="h0" class="corner-handle"></div>
                    <div id="h1" class="corner-handle"></div>
                    <div id="h2" class="corner-handle"></div>
                    <div id="h3" class="corner-handle"></div>
                </div>
                <svg class="absolute inset-0 w-full h-full pointer-events-none">
                    <polygon id="poly-guide" points="" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="2" />
                </svg>
            </div>
        </div>

        <div id="tap-hint" class="hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/60 px-6 py-3 rounded-2xl text-xs font-bold animate-pulse text-center text-white">
            TOCA EL CENTRO PARA ESCANEAR
        </div>

        <div id="placeholder" class="absolute inset-0 flex items-center justify-center text-slate-500 bg-slate-900">
            <p>Esperando cámara...</p>
        </div>
    </main>

    <footer class="app-footer">
        <div class="max-w-md mx-auto space-y-4">
            
            <!-- Botones de cámara -->
            <div id="camera-controls">
                <button id="start-btn" class="bg-white text-slate-900 px-8 py-3 rounded-xl font-bold w-full shadow-lg">Activar Cámara</button>
            </div>

            <!-- Botones de edición -->
            <div id="edit-controls" class="hidden grid grid-cols-2 gap-3">
                <button id="auto-detect-btn" class="bg-blue-600 text-white py-3 rounded-xl font-bold text-sm">Auto-Ajuste</button>
                <button id="confirm-warp-btn" class="bg-emerald-500 text-white py-3 rounded-xl font-bold text-sm">Aplanar Página</button>
                <button id="cancel-edit-btn" class="col-span-2 bg-slate-800 text-slate-400 py-2 rounded-lg text-xs font-bold uppercase">Descartar</button>
            </div>

            <!-- Opciones y Guardado -->
            <div class="flex items-center justify-between border-t border-slate-800 pt-3">
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="filter-bw" class="w-5 h-5 accent-emerald-500" checked>
                    <label for="filter-bw" class="text-xs font-bold text-slate-400">B&N</label>
                </div>
                <div class="flex gap-2">
                    <button id="reset-btn" class="text-[10px] font-bold text-rose-500 uppercase px-2 py-2">Limpiar</button>
                    <button id="generate-btn" disabled class="bg-slate-700 text-slate-500 px-4 py-2 rounded-lg text-xs font-bold">Bajar PDF</button>
                </div>
            </div>
        </div>
    </footer>

    <script>
        const { jsPDF } = window.jspdf;
        const video = document.getElementById('video');
        const videoContainer = document.getElementById('video-container');
        const editLayer = document.getElementById('edit-layer');
        const editCanvas = document.getElementById('edit-canvas');
        const polyGuide = document.getElementById('poly-guide');
        const startBtn = document.getElementById('start-btn');
        const tapHint = document.getElementById('tap-hint');
        const autoDetectBtn = document.getElementById('auto-detect-btn');
        const confirmWarpBtn = document.getElementById('confirm-warp-btn');
        const cancelEditBtn = document.getElementById('cancel-edit-btn');
        const generateBtn = document.getElementById('generate-btn');

        let pages = [];
        let stream = null;
        let capturedImage = null;
        let corners = []; 
        let isEditing = false;

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } 
                });
                video.srcObject = stream;
                document.getElementById('placeholder').classList.add('hidden');
                startBtn.parentElement.classList.add('hidden');
                tapHint.classList.remove('hidden');
            } catch (err) { alert("Jorge, activa los permisos de cámara."); }
        }

        function captureToEdit() {
            if (isEditing || !stream) return;
            isEditing = true;

            const temp = document.createElement('canvas');
            temp.width = video.videoWidth;
            temp.height = video.videoHeight;
            temp.getContext('2d').drawImage(video, 0, 0);
            capturedImage = temp;

            showEditor();
        }

        videoContainer.onclick = (e) => {
            if (!isEditing && (e.target === video || e.target === tapHint || e.target === videoContainer)) {
                captureToEdit();
            }
        };

        function showEditor() {
            editLayer.classList.remove('hidden');
            tapHint.classList.add('hidden');
            document.getElementById('edit-controls').classList.remove('hidden');

            editCanvas.width = capturedImage.width;
            editCanvas.height = capturedImage.height;
            editCanvas.getContext('2d').drawImage(capturedImage, 0, 0);

            const w = editCanvas.width;
            const h = editCanvas.height;
            corners = [{x:w*0.1, y:h*0.1}, {x:w*0.9, y:h*0.1}, {x:w*0.9, y:h*0.9}, {x:w*0.1, y:h*0.9}];
            
            setupHandles();
            updateUI();
        }

        function setupHandles() {
            for (let i = 0; i < 4; i++) {
                const h = document.getElementById(`h${i}`);
                h.onpointerdown = (e) => {
                    e.preventDefault();
                    h.setPointerCapture(e.pointerId);
                    
                    const moveHandler = (pe) => {
                        const rect = editCanvas.getBoundingClientRect();
                        const scaleX = rect.width / editCanvas.width;
                        const scaleY = rect.height / editCanvas.height;
                        
                        // CLAMPING: Evita que los puntos se salgan del canvas
                        let newX = (pe.clientX - rect.left) / scaleX;
                        let newY = (pe.clientY - rect.top) / scaleY;
                        
                        corners[i].x = Math.max(0, Math.min(editCanvas.width, newX));
                        corners[i].y = Math.max(0, Math.min(editCanvas.height, newY));
                        updateUI();
                    };

                    h.onpointermove = moveHandler;
                    h.onpointerup = () => {
                        h.onpointermove = null;
                        h.releasePointerCapture(e.pointerId);
                    };
                };
            }
        }

        function updateUI() {
            const rect = editCanvas.getBoundingClientRect();
            const scaleX = rect.width / editCanvas.width;
            const scaleY = rect.height / editCanvas.height;

            let polyPoints = "";
            corners.forEach((c, i) => {
                const h = document.getElementById(`h${i}`);
                h.style.left = `${c.x * scaleX}px`;
                h.style.top = `${c.y * scaleY}px`;
                polyPoints += `${c.x * scaleX},${c.y * scaleY} `;
            });
            polyGuide.setAttribute('points', polyPoints);
        }

        function autoDetect() {
            const ctx = editCanvas.getContext('2d');
            const data = ctx.getImageData(0, 0, editCanvas.width, editCanvas.height).data;
            const w = editCanvas.width;
            const h = editCanvas.height;
            let minX = w, maxX = 0, minY = h, maxY = 0;
            let found = false;

            for (let y = 0; y < h; y += 20) {
                for (let x = 0; x < w; x += 20) {
                    const i = (y * w + x) * 4;
                    if ((data[i] + data[i+1] + data[i+2]) / 3 > 140) {
                        if (x < minX) minX = x; if (x > maxX) maxX = x;
                        if (y < minY) minY = y; if (y > maxY) maxY = y;
                        found = true;
                    }
                }
            }
            if (found) {
                corners = [{x:minX, y:minY}, {x:maxX, y:minY}, {x:maxX, y:maxY}, {x:minX, y:maxY}];
                updateUI();
            }
        }

        function warpAndAdd() {
            const outW = 1000; const outH = 1400; 
            const canvas = document.createElement('canvas');
            canvas.width = outW; canvas.height = outH;
            const ctx = canvas.getContext('2d');

            ctx.drawImage(capturedImage, 
                corners[0].x, corners[0].y, 
                corners[1].x - corners[0].x, corners[3].y - corners[0].y, 
                0, 0, outW, outH
            );

            if (document.getElementById('filter-bw').checked) {
                const img = ctx.getImageData(0,0, outW, outH);
                const d = img.data;
                for (let i=0; i<d.length; i+=4) {
                    const g = d[i]*0.3 + d[i+1]*0.59 + d[i+2]*0.11;
                    const v = g > 130 ? 255 : (g < 70 ? 0 : g);
                    d[i] = d[i+1] = d[i+2] = v;
                }
                ctx.putImageData(img, 0, 0);
            }

            pages.push({ data: canvas.toDataURL('image/jpeg', 0.9), w: outW, h: outH });
            closeEditor();
            updateStats();
        }

        function closeEditor() {
            isEditing = false;
            editLayer.classList.add('hidden');
            tapHint.classList.remove('hidden');
            document.getElementById('edit-controls').classList.add('hidden');
        }

        function updateStats() {
            document.getElementById('page-counter').innerText = `${pages.length} PÁGS`;
            if (pages.length > 0) {
                generateBtn.disabled = false;
                generateBtn.classList.replace('bg-slate-700', 'bg-blue-600');
                generateBtn.classList.replace('text-slate-500', 'text-white');
            }
        }

        startBtn.onclick = startCamera;
        autoDetectBtn.onclick = autoDetect;
        confirmWarpBtn.onclick = warpAndAdd;
        cancelEditBtn.onclick = closeEditor;
        generateBtn.onclick = () => {
            const doc = new jsPDF('p', 'px', [pages[0].w, pages[0].h]);
            pages.forEach((p, i) => {
                if (i > 0) doc.addPage([p.w, p.h], 'p');
                doc.addImage(p.data, 'JPEG', 0, 0, p.w, p.h);
            });
            doc.save(`Scan_Jorge_${Date.now()}.pdf`);
        };
        document.getElementById('reset-btn').onclick = () => { if(confirm("¿Borrar todo?")) { pages = []; updateStats(); location.reload(); }};
        window.onresize = () => { if(isEditing) updateUI(); };
    </script>
</body>
</html>
