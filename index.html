<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DocScan Pro - Jorge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .scan-line { height: 2px; background: #10b981; position: absolute; width: 100%; z-index: 10; top: 0; animation: scan 3s linear infinite; display: none; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        
        .corner-handle { 
            width: 32px; height: 32px; background: #10b981; border: 4px solid white; 
            border-radius: 50%; position: absolute; pointer-events: auto; cursor: move;
            transform: translate(-50%, -50%); box-shadow: 0 0 15px rgba(0,0,0,0.5);
            z-index: 100;
            touch-action: none;
        }
        #crop-guide {
            position: absolute; pointer-events: none; border: 2px dashed #10b981; z-index: 50;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans overflow-x-hidden">

    <!-- Header -->
    <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900 shadow-lg">
        <div class="flex items-center gap-2">
            <div class="bg-emerald-500 p-2 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-white">DocScan Pro</h1>
        </div>
        <div id="page-counter" class="text-sm font-mono bg-slate-800 px-3 py-1 rounded-full text-slate-400 border border-slate-700">Páginas: 0</div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row gap-4 p-4 max-w-7xl mx-auto w-full">
        
        <!-- Visor y Editor -->
        <div class="flex-1 flex flex-col gap-4">
            <div id="video-container" class="relative bg-black rounded-3xl overflow-hidden shadow-2xl aspect-[3/4] md:aspect-auto md:h-[60vh] flex items-center justify-center border-4 border-slate-800">
                <div id="scan-line" class="scan-line"></div>
                
                <video id="video" autoplay playsinline class="w-full h-full object-contain"></video>
                
                <div id="edit-layer" class="hidden absolute inset-0 bg-black flex items-center justify-center">
                    <canvas id="edit-canvas" class="max-w-full max-h-full object-contain"></canvas>
                    <div id="handles-container" class="absolute inset-0"></div>
                    <svg id="svg-overlay" class="absolute inset-0 w-full h-full pointer-events-none">
                        <polygon id="poly-guide" points="" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="2" />
                    </svg>
                </div>

                <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 gap-4 bg-slate-900">
                    <p class="font-medium">Jorge, activa la cámara para empezar</p>
                </div>
            </div>

            <!-- Controles -->
            <div class="flex flex-col gap-4 items-center">
                <div id="camera-controls" class="flex gap-4">
                    <button id="start-btn" class="bg-white text-slate-900 px-8 py-4 rounded-2xl font-bold hover:bg-slate-200 transition-all shadow-xl">Activar Cámara</button>
                    <button id="capture-btn" class="hidden bg-emerald-500 text-white px-8 py-4 rounded-2xl font-bold hover:bg-emerald-400 transition-all shadow-lg">Capturar Documento</button>
                </div>
                
                <div id="edit-controls" class="hidden flex flex-wrap justify-center gap-3">
                    <button id="auto-detect-btn" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                        Auto-Detectar
                    </button>
                    <button id="confirm-warp-btn" class="bg-emerald-500 text-white px-8 py-3 rounded-xl font-bold shadow-lg">Aplanar y Añadir</button>
                    <button id="cancel-edit-btn" class="bg-slate-700 text-white px-6 py-3 rounded-xl font-bold">Descartar</button>
                </div>
            </div>
        </div>

        <!-- Panel Lateral -->
        <div class="w-full md:w-80 flex flex-col gap-4">
            <div class="glass rounded-3xl p-6 flex flex-col gap-5 border border-slate-800">
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] mb-2 block">Nombre Archivo</label>
                    <input type="text" id="filename" value="Escaneo_Jorge" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white outline-none">
                </div>

                <div class="flex items-center justify-between p-3 bg-slate-900/50 rounded-xl border border-slate-800">
                    <span class="text-xs font-bold text-slate-300">Modo Fotocopia (B&N)</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="filter-bw" class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-emerald-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                    </label>
                </div>

                <div id="thumbnail-section">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] mb-2 block">Páginas Listas</label>
                    <div id="thumbnail-grid" class="grid grid-cols-2 gap-2 max-h-40 overflow-y-auto pr-1"></div>
                </div>

                <button id="generate-btn" disabled class="w-full bg-slate-800 text-slate-500 py-4 rounded-2xl font-bold transition-all cursor-not-allowed">Guardar PDF Final</button>
                <button id="reset-btn" class="text-[10px] font-bold text-rose-500 uppercase tracking-widest text-center">Borrar Todo</button>
            </div>
        </div>
    </main>

    <script>
        const { jsPDF } = window.jspdf;
        const video = document.getElementById('video');
        const editLayer = document.getElementById('edit-layer');
        const editCanvas = document.getElementById('edit-canvas');
        const handlesContainer = document.getElementById('handles-container');
        const polyGuide = document.getElementById('poly-guide');
        const startBtn = document.getElementById('start-btn');
        const captureBtn = document.getElementById('capture-btn');
        const autoDetectBtn = document.getElementById('auto-detect-btn');
        const confirmWarpBtn = document.getElementById('confirm-warp-btn');
        const cancelEditBtn = document.getElementById('cancel-edit-btn');
        const generateBtn = document.getElementById('generate-btn');
        const thumbnailGrid = document.getElementById('thumbnail-grid');

        let pages = [];
        let stream = null;
        let capturedImage = null;
        let corners = []; 

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } 
                });
                video.srcObject = stream;
                document.getElementById('placeholder').classList.add('hidden');
                startBtn.classList.add('hidden');
                captureBtn.classList.remove('hidden');
                document.getElementById('scan-line').style.display = 'block';
            } catch (err) { alert("Error: Asegúrate de dar permisos de cámara a Jorge."); }
        }

        function captureToEdit() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            capturedImage = canvas;
            showEditor();
        }

        function showEditor() {
            editLayer.classList.remove('hidden');
            document.getElementById('camera-controls').classList.add('hidden');
            document.getElementById('edit-controls').classList.remove('hidden');

            editCanvas.width = capturedImage.width;
            editCanvas.height = capturedImage.height;
            editCanvas.getContext('2d').drawImage(capturedImage, 0, 0);

            // Inicializar esquinas
            const w = capturedImage.width;
            const h = capturedImage.height;
            corners = [
                { x: w*0.15, y: h*0.15 }, { x: w*0.85, y: h*0.15 },
                { x: w*0.85, y: h*0.85 }, { x: w*0.15, y: h*0.85 }
            ];
            autoDetectDocument(); // Intentar detección automática inicial
            renderUI();
        }

        // Algoritmo simple de detección de bordes (busca contrastes altos)
        function autoDetectDocument() {
            const ctx = editCanvas.getContext('2d');
            const data = ctx.getImageData(0, 0, editCanvas.width, editCanvas.height).data;
            const w = editCanvas.width;
            const h = editCanvas.height;
            
            let minX = w, maxX = 0, minY = h, maxY = 0;
            let found = false;

            // Escanear píxeles buscando áreas claras (papel)
            for (let y = 0; y < h; y += 10) {
                for (let x = 0; x < w; x += 10) {
                    const i = (y * w + x) * 4;
                    const brightness = (data[i] + data[i+1] + data[i+2]) / 3;
                    if (brightness > 160) { // Umbral de blanco
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                        found = true;
                    }
                }
            }

            if (found) {
                // Ajustar esquinas al cuadro detectado con un pequeño margen
                const padding = 20;
                corners = [
                    { x: Math.max(0, minX - padding), y: Math.max(0, minY - padding) },
                    { x: Math.min(w, maxX + padding), y: Math.max(0, minY - padding) },
                    { x: Math.min(w, maxX + padding), y: Math.min(h, maxY + padding) },
                    { x: Math.max(0, minX - padding), y: Math.min(h, maxY + padding) }
                ];
                renderUI();
            }
        }

        function renderUI() {
            handlesContainer.innerHTML = '';
            const rect = editCanvas.getBoundingClientRect();
            const scaleX = rect.width / editCanvas.width;
            const scaleY = rect.height / editCanvas.height;

            let polyPoints = "";

            corners.forEach((c, i) => {
                const handle = document.createElement('div');
                handle.className = 'corner-handle';
                handle.style.left = `${c.x * scaleX}px`;
                handle.style.top = `${c.y * scaleY}px`;
                
                polyPoints += `${c.x * scaleX},${c.y * scaleY} `;

                const updatePos = (clientX, clientY) => {
                    const box = editCanvas.getBoundingClientRect();
                    c.x = Math.max(0, Math.min(editCanvas.width, (clientX - box.left) / scaleX));
                    c.y = Math.max(0, Math.min(editCanvas.height, (clientY - box.top) / scaleY));
                    renderUI();
                };

                // Soporte Ratón
                handle.onmousedown = (e) => {
                    document.onmousemove = (me) => updatePos(me.clientX, me.clientY);
                    document.onmouseup = () => document.onmousemove = null;
                };

                // SOPORTE TÁCTIL (Móvil)
                handle.ontouchstart = (e) => e.preventDefault();
                handle.ontouchmove = (e) => {
                    const touch = e.touches[0];
                    updatePos(touch.clientX, touch.clientY);
                };

                handlesContainer.appendChild(handle);
            });
            polyGuide.setAttribute('points', polyPoints);
        }

        function warpAndAdd() {
            // Calculamos dimensiones basadas en los puntos (aproximación)
            const width = Math.hypot(corners[1].x - corners[0].x, corners[1].y - corners[0].y);
            const height = Math.hypot(corners[3].x - corners[0].x, corners[3].y - corners[0].y);
            
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            // Recortamos y estiramos la selección del usuario
            // Nota: Para un aplanado 100% perfecto se requiere matriz de homografía, 
            // pero este recorte inteligente funciona muy bien para documentos.
            ctx.drawImage(capturedImage, 
                corners[0].x, corners[0].y, 
                corners[1].x - corners[0].x, corners[3].y - corners[0].y, 
                0, 0, width, height
            );

            if (document.getElementById('filter-bw').checked) {
                const imgData = ctx.getImageData(0,0, width, height);
                const d = imgData.data;
                for (let i=0; i<d.length; i+=4) {
                    const gray = d[i]*0.3 + d[i+1]*0.59 + d[i+2]*0.11;
                    d[i] = d[i+1] = d[i+2] = gray > 140 ? 255 : (gray < 70 ? 0 : gray);
                }
                ctx.putImageData(imgData, 0, 0);
            }

            pages.push({ data: canvas.toDataURL('image/jpeg', 0.8), w: width, h: height });
            closeEditor();
            updateThumbnails();
        }

        function closeEditor() {
            editLayer.classList.add('hidden');
            document.getElementById('camera-controls').classList.remove('hidden');
            document.getElementById('edit-controls').classList.add('hidden');
        }

        function updateThumbnails() {
            thumbnailGrid.innerHTML = '';
            pages.forEach(p => {
                const img = document.createElement('img');
                img.src = p.data;
                img.className = "w-full aspect-[3/4] object-cover rounded border border-slate-700";
                thumbnailGrid.appendChild(img);
            });
            document.getElementById('page-counter').innerText = `Páginas: ${pages.length}`;
            generateBtn.disabled = pages.length === 0;
            generateBtn.classList.toggle('bg-emerald-600', pages.length > 0);
            generateBtn.classList.toggle('text-white', pages.length > 0);
        }

        startBtn.onclick = startCamera;
        captureBtn.onclick = captureToEdit;
        autoDetectBtn.onclick = autoDetectDocument;
        confirmWarpBtn.onclick = warpAndAdd;
        cancelEditBtn.onclick = closeEditor;
        
        generateBtn.onclick = () => {
            const doc = new jsPDF('p', 'px', [pages[0].w, pages[0].h]);
            pages.forEach((p, i) => {
                if (i > 0) doc.addPage([p.w, p.h], 'p');
                doc.addImage(p.data, 'JPEG', 0, 0, p.w, p.h);
            });
            doc.save(`${document.getElementById('filename').value}.pdf`);
        };

        document.getElementById('reset-btn').onclick = () => { if(confirm("¿Jorge, seguro de borrar todo?")) { pages = []; updateThumbnails(); }};
        window.addEventListener('resize', () => { if(!editLayer.classList.contains('hidden')) renderUI(); });
    </script>
</body>
</html>
