<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DocScan Pro - Jorge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background-color: #020617;
            display: flex;
            flex-direction: column;
            touch-action: none;
        }
        .app-header {
            height: 55px;
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            flex-shrink: 0;
            z-index: 100;
        }
        .main-content {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
        }
        .app-footer {
            background: #0f172a;
            border-top: 1px solid #1e293b;
            padding: 10px 15px 20px 15px;
            flex-shrink: 0;
            z-index: 1000;
        }
        .corner-handle { 
            width: 42px; height: 42px; 
            background: rgba(16, 185, 129, 0.9); 
            border: 3px solid white; 
            border-radius: 50%; 
            position: absolute; 
            pointer-events: auto;
            transform: translate(-50%, -50%); 
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
            z-index: 200; 
            touch-action: none;
        }
        #canvas-wrapper {
            position: relative;
            display: inline-block;
            max-width: 90%;
            max-height: 80%;
            border: 2px solid #10b981;
        }
        #edit-canvas {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }
        #status-msg {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            color: #10b981;
            z-index: 60;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="flex items-center gap-2">
            <div class="bg-emerald-500 p-1 rounded-lg text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
            </div>
            <span class="font-bold text-white tracking-tight">DocScan Pro</span>
        </div>
        <div id="page-counter" class="text-xs font-mono bg-slate-800 px-3 py-1 rounded-full border border-slate-700 text-slate-300">0 PÁGS</div>
    </header>

    <main class="main-content" id="video-container">
        <div id="status-msg" class="hidden">INICIANDO CÁMARA...</div>
        
        <video id="video" autoplay playsinline muted class="w-full h-full object-contain"></video>
        
        <!-- Capa de Edición -->
        <div id="edit-layer" class="hidden absolute inset-0 bg-black/95 flex items-center justify-center p-4 z-40">
            <div id="canvas-wrapper">
                <canvas id="edit-canvas"></canvas>
                <div id="handles-container" class="absolute inset-0 pointer-events-none">
                    <div id="h0" class="corner-handle"></div>
                    <div id="h1" class="corner-handle"></div>
                    <div id="h2" class="corner-handle"></div>
                    <div id="h3" class="corner-handle"></div>
                </div>
                <svg class="absolute inset-0 w-full h-full pointer-events-none">
                    <polygon id="poly-guide" points="" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="3" />
                </svg>
            </div>
        </div>

        <div id="tap-hint" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/60 px-6 py-3 rounded-2xl text-xs font-bold animate-pulse text-center text-white pointer-events-none z-10 hidden">
            TOCA EL CENTRO PARA ESCANEAR
        </div>

        <div id="placeholder" class="absolute inset-0 flex items-center justify-center text-slate-500 bg-slate-900 z-0">
            <p>Jorge, presiona Activar para comenzar</p>
        </div>
    </main>

    <footer class="app-footer">
        <div class="max-w-md mx-auto space-y-4">
            
            <div id="camera-controls">
                <button id="start-btn" type="button" class="bg-white text-slate-900 px-8 py-3 rounded-xl font-bold w-full shadow-lg active:scale-95 transition-transform">Activar Cámara</button>
            </div>

            <div id="edit-controls" class="hidden grid grid-cols-2 gap-3">
                <button id="auto-detect-btn" type="button" class="bg-blue-600 text-white py-3 rounded-xl font-bold text-sm shadow-md active:scale-95">Auto-Ajuste</button>
                <button id="confirm-warp-btn" type="button" class="bg-emerald-500 text-white py-3 rounded-xl font-bold text-sm shadow-md active:scale-95">Aplanar Página</button>
                <button id="cancel-edit-btn" type="button" class="col-span-2 bg-slate-800 text-slate-400 py-2 rounded-lg text-xs font-bold uppercase tracking-widest">Descartar</button>
            </div>

            <div class="flex items-center justify-between border-t border-slate-800 pt-3">
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="filter-bw" class="w-5 h-5 accent-emerald-500" checked>
                    <label for="filter-bw" class="text-xs font-bold text-slate-400">Blanco y Negro</label>
                </div>
                <div class="flex gap-2">
                    <button id="reset-btn" type="button" class="text-[10px] font-bold text-rose-500 uppercase px-2 py-2">Limpiar</button>
                    <button id="generate-btn" type="button" disabled class="bg-slate-700 text-slate-500 px-4 py-2 rounded-lg text-xs font-bold transition-all shadow-sm">Bajar PDF</button>
                </div>
            </div>
        </div>
    </footer>

    <script>
        const { jsPDF } = window.jspdf;
        const video = document.getElementById('video');
        const videoContainer = document.getElementById('video-container');
        const editLayer = document.getElementById('edit-layer');
        const editCanvas = document.getElementById('edit-canvas');
        const polyGuide = document.getElementById('poly-guide');
        const startBtn = document.getElementById('start-btn');
        const tapHint = document.getElementById('tap-hint');
        const statusMsg = document.getElementById('status-msg');
        const confirmWarpBtn = document.getElementById('confirm-warp-btn');
        const cancelEditBtn = document.getElementById('cancel-edit-btn');
        const generateBtn = document.getElementById('generate-btn');

        let pages = [];
        let stream = null;
        let capturedImage = null;
        let corners = []; 
        let isEditing = false;

        // FUNCIÓN MEJORADA: Intenta alta resolución, si falla, intenta resolución básica
        async function startCamera() {
            statusMsg.classList.remove('hidden');
            statusMsg.innerText = "ACCEDIENDO A ÓPTICA...";
            
            const constraints = [
                { video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } },
                { video: { facingMode: "environment" } },
                { video: true }
            ];

            for (const constraint of constraints) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraint);
                    video.srcObject = stream;
                    await video.play(); // Forzar el play del video
                    
                    document.getElementById('placeholder').classList.add('hidden');
                    startBtn.parentElement.classList.add('hidden');
                    tapHint.classList.remove('hidden');
                    statusMsg.innerText = "CÁMARA CONECTADA";
                    setTimeout(() => statusMsg.classList.add('hidden'), 2000);
                    return;
                } catch (err) {
                    console.log("Reintentando con otra configuración...");
                }
            }
            
            alert("Jorge, no pudimos abrir la cámara. Revisa si el navegador tiene permiso.");
            statusMsg.innerText = "ERROR DE CÁMARA";
        }

        function captureToEdit() {
            if (isEditing || !stream) return;
            isEditing = true;

            const temp = document.createElement('canvas');
            temp.width = video.videoWidth;
            temp.height = video.videoHeight;
            temp.getContext('2d').drawImage(video, 0, 0);
            capturedImage = temp;

            showEditor();
        }

        // Listener de toque corregido para Jorge
        videoContainer.addEventListener('mousedown', (e) => {
            if (!isEditing && e.target === video) captureToEdit();
        });
        
        videoContainer.addEventListener('touchstart', (e) => {
            if (!isEditing && e.target === video) captureToEdit();
        });

        function showEditor() {
            editLayer.classList.remove('hidden');
            tapHint.classList.add('hidden');
            document.getElementById('edit-controls').classList.remove('hidden');

            editCanvas.width = capturedImage.width;
            editCanvas.height = capturedImage.height;
            editCanvas.getContext('2d').drawImage(capturedImage, 0, 0);

            const w = editCanvas.width;
            const h = editCanvas.height;
            corners = [{x: w*0.1, y: h*0.1}, {x: w*0.9, y: h*0.1}, {x: w*0.9, y: h*0.9}, {x: w*0.1, y: h*0.9}];
            
            setupHandles();
            updateUI();
        }

        function setupHandles() {
            for (let i = 0; i < 4; i++) {
                const h = document.getElementById(`h${i}`);
                h.onpointerdown = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    h.setPointerCapture(e.pointerId);
                    
                    const moveHandler = (pe) => {
                        const rect = editCanvas.getBoundingClientRect();
                        const scaleX = rect.width / editCanvas.width;
                        const scaleY = rect.height / editCanvas.height;
                        
                        corners[i].x = Math.max(0, Math.min(editCanvas.width, (pe.clientX - rect.left) / scaleX));
                        corners[i].y = Math.max(0, Math.min(editCanvas.height, (pe.clientY - rect.top) / scaleY));
                        updateUI();
                    };

                    h.onpointermove = moveHandler;
                    h.onpointerup = () => {
                        h.onpointermove = null;
                        h.releasePointerCapture(e.pointerId);
                    };
                };
            }
        }

        function updateUI() {
            const rect = editCanvas.getBoundingClientRect();
            const scaleX = rect.width / editCanvas.width;
            const scaleY = rect.height / editCanvas.height;

            let polyPoints = "";
            corners.forEach((c, i) => {
                const h = document.getElementById(`h${i}`);
                h.style.left = `${c.x * scaleX}px`;
                h.style.top = `${c.y * scaleY}px`;
                polyPoints += `${c.x * scaleX},${c.y * scaleY} `;
            });
            polyGuide.setAttribute('points', polyPoints);
        }

        function warpAndAdd(e) {
            if(e) { e.preventDefault(); e.stopPropagation(); }
            
            const minX = Math.min(...corners.map(c => c.x));
            const maxX = Math.max(...corners.map(c => c.x));
            const minY = Math.min(...corners.map(c => c.y));
            const maxY = Math.max(...corners.map(c => c.y));
            
            const srcW = maxX - minX;
            const srcH = maxY - minY;

            if (srcW < 30 || srcH < 30) return;

            const outW = 1000; const outH = 1400; 
            const procCanvas = document.createElement('canvas');
            procCanvas.width = outW; procCanvas.height = outH;
            const ctx = procCanvas.getContext('2d');

            ctx.drawImage(capturedImage, minX, minY, srcW, srcH, 0, 0, outW, outH);

            if (document.getElementById('filter-bw').checked) {
                const img = ctx.getImageData(0, 0, outW, outH);
                const d = img.data;
                for (let i=0; i<d.length; i+=4) {
                    const g = d[i]*0.3 + d[i+1]*0.59 + d[i+2]*0.11;
                    d[i] = d[i+1] = d[i+2] = g > 130 ? 255 : (g < 75 ? 0 : g);
                }
                ctx.putImageData(img, 0, 0);
            }

            pages.push({ data: procCanvas.toDataURL('image/jpeg', 0.85), w: outW, h: outH });
            
            isEditing = false;
            editLayer.classList.add('hidden');
            tapHint.classList.remove('hidden');
            document.getElementById('edit-controls').classList.add('hidden');
            
            updateStats();
        }

        function updateStats() {
            document.getElementById('page-counter').innerText = `${pages.length} PÁGS`;
            if (pages.length > 0) {
                generateBtn.disabled = false;
                generateBtn.classList.replace('bg-slate-700', 'bg-blue-600');
                generateBtn.classList.replace('text-slate-500', 'text-white');
            }
        }

        startBtn.onclick = startCamera;
        confirmWarpBtn.onclick = warpAndAdd;
        cancelEditBtn.onclick = (e) => { e.stopPropagation(); isEditing = false; editLayer.classList.add('hidden'); tapHint.classList.remove('hidden'); document.getElementById('edit-controls').classList.add('hidden'); };
        
        generateBtn.onclick = (e) => {
            e.stopPropagation();
            const doc = new jsPDF('p', 'px', [pages[0].w, pages[0].h]);
            pages.forEach((p, i) => {
                if (i > 0) doc.addPage([p.w, p.h], 'p');
                doc.addImage(p.data, 'JPEG', 0, 0, p.w, p.h);
            });
            doc.save(`Scan_Jorge_${Date.now()}.pdf`);
        };

        document.getElementById('reset-btn').onclick = () => { if(confirm("¿Borrar todo?")) location.reload(); };
        window.onresize = () => { if(isEditing) updateUI(); };
    </script>
</body>
</html>
