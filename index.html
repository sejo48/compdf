<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>DocScan Pro - Jorge</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<style>

body{
background:#020617;
margin:0;
font-family:sans-serif;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

header{
background:#0f172a;
padding:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

main{
flex:1;
display:flex;
align-items:center;
justify-content:center;
background:black;
position:relative;
}

footer{
background:#0f172a;
padding:10px;
}

video{
width:100%;
height:100%;
object-fit:contain;
}

#edit-layer{
position:absolute;
inset:0;
background:black;
display:none;
align-items:center;
justify-content:center;
}

canvas{
max-width:90%;
max-height:90%;
}

.corner{
width:30px;
height:30px;
background:#10b981;
border-radius:50%;
position:absolute;
transform:translate(-50%,-50%);
}

</style>

</head>

<body>

<header>

<div>DocScan Pro</div>

<div id="counter">0 PÁGS</div>

</header>

<main id="video-area">

<video id="video" autoplay playsinline></video>

<div id="edit-layer">

<canvas id="canvas"></canvas>

<div id="p0" class="corner"></div>
<div id="p1" class="corner"></div>
<div id="p2" class="corner"></div>
<div id="p3" class="corner"></div>

</div>

</main>

<footer>

<button id="start">Activar cámara</button>

<button id="auto">Auto ajustar</button>

<button id="scan">Escanear</button>

<button id="pdf">Bajar PDF</button>

</footer>

<script>

const {jsPDF}=window.jspdf

let video=document.getElementById("video")

let canvas=document.getElementById("canvas")

let ctx=canvas.getContext("2d")

let stream=null

let pages=[]

let captured=null

let corners=[]

let editing=false



async function startCamera(){

stream=await navigator.mediaDevices.getUserMedia({

video:{facingMode:"environment"}

})

video.srcObject=stream

}



document.getElementById("start").onclick=startCamera



video.onclick=()=>{

if(editing)return

capture()

}



function capture(){

canvas.width=video.videoWidth

canvas.height=video.videoHeight

ctx.drawImage(video,0,0)

captured=ctx.getImageData(0,0,canvas.width,canvas.height)

document.getElementById("edit-layer").style.display="flex"

editing=true

corners=[

{x:50,y:50},

{x:canvas.width-50,y:50},

{x:canvas.width-50,y:canvas.height-50},

{x:50,y:canvas.height-50}

]

updateCorners()

}



function updateCorners(){

corners.forEach((c,i)=>{

let el=document.getElementById("p"+i)

let rect=canvas.getBoundingClientRect()

let sx=rect.width/canvas.width

let sy=rect.height/canvas.height

el.style.left=c.x*sx+"px"

el.style.top=c.y*sy+"px"

})

}



function autoDetect(){

let src=cv.imread(canvas)

let gray=new cv.Mat()

let blur=new cv.Mat()

let edge=new cv.Mat()

cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY)

cv.GaussianBlur(gray,blur,new cv.Size(5,5),0)

cv.Canny(blur,edge,75,200)

let contours=new cv.MatVector()

let hierarchy=new cv.Mat()

cv.findContours(edge,contours,hierarchy,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE)

let maxArea=0

let best=null

for(let i=0;i<contours.size();i++){

let cnt=contours.get(i)

let area=cv.contourArea(cnt)

if(area>5000){

let peri=cv.arcLength(cnt,true)

let approx=new cv.Mat()

cv.approxPolyDP(cnt,approx,0.02*peri,true)

if(approx.rows===4&&area>maxArea){

best=approx

maxArea=area

}

}

}

if(best){

corners=[]

for(let i=0;i<4;i++){

corners.push({

x:best.intPtr(i,0)[0],

y:best.intPtr(i,0)[1]

})

}

updateCorners()

}

src.delete()

gray.delete()

blur.delete()

edge.delete()

}



document.getElementById("auto").onclick=autoDetect



document.getElementById("scan").onclick=()=>{

let minX=Math.min(...corners.map(c=>c.x))

let maxX=Math.max(...corners.map(c=>c.x))

let minY=Math.min(...corners.map(c=>c.y))

let maxY=Math.max(...corners.map(c=>c.y))

let w=maxX-minX

let h=maxY-minY

let temp=document.createElement("canvas")

temp.width=1000

temp.height=1400

let tctx=temp.getContext("2d")

tctx.filter="contrast(140%) brightness(110%)"

tctx.drawImage(canvas,minX,minY,w,h,0,0,1000,1400)

pages.push(temp.toDataURL("image/jpeg",0.7))

document.getElementById("counter").innerText=pages.length+" PÁGS"

editing=false

document.getElementById("edit-layer").style.display="none"

}



document.getElementById("pdf").onclick=()=>{

if(pages.length==0)return

let doc=new jsPDF("p","px",[1000,1400])

pages.forEach((p,i)=>{

if(i>0)doc.addPage()

doc.addImage(p,"JPEG",0,0,1000,1400)

})

doc.save("Scan_Jorge.pdf")

}



</script>

</body>
</html>
