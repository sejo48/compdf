<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DocScan Pro - Jorge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .scan-line { height: 2px; background: #10b981; position: absolute; width: 100%; z-index: 10; top: 0; animation: scan 3s linear infinite; display: none; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        
        .corner-handle { 
            width: 44px; height: 44px; background: rgba(16, 185, 129, 0.8); border: 3px solid white; 
            border-radius: 50%; position: absolute; pointer-events: auto;
            transform: translate(-50%, -50%); box-shadow: 0 0 15px rgba(0,0,0,0.5);
            z-index: 100; touch-action: none;
        }
        /* Lupa para ver mejor debajo del dedo */
        .corner-handle::after {
            content: ""; position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
            width: 60px; height: 60px; border-radius: 50%; border: 2px solid white;
            background: inherit; background-image: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.4) 100%);
            display: none;
        }
        .corner-handle:active::after { display: block; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans overflow-hidden">

    <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900">
        <div class="flex items-center gap-2">
            <div class="bg-emerald-500 p-2 rounded-lg"><svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg></div>
            <h1 class="text-xl font-bold tracking-tight">DocScan Pro</h1>
        </div>
        <div id="page-counter" class="text-sm font-mono bg-slate-800 px-3 py-1 rounded-full border border-slate-700">0 PÁGS</div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row gap-4 p-4 w-full overflow-hidden">
        <div class="flex-1 flex flex-col gap-4 relative">
            <div id="video-container" class="relative bg-black rounded-3xl overflow-hidden shadow-2xl flex-1 flex items-center justify-center border-4 border-slate-800">
                <div id="scan-line" class="scan-line"></div>
                <video id="video" autoplay playsinline class="w-full h-full object-contain"></video>
                
                <div id="edit-layer" class="hidden absolute inset-0 bg-black flex items-center justify-center">
                    <!-- El canvas de edición debe ser relativo para que los puntos se posicionen bien -->
                    <div id="canvas-wrapper" class="relative inline-block">
                        <canvas id="edit-canvas" class="max-w-full max-h-full block"></canvas>
                        <div id="handles-container" class="absolute inset-0 pointer-events-none"></div>
                        <svg id="svg-overlay" class="absolute inset-0 w-full h-full pointer-events-none">
                            <polygon id="poly-guide" points="" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="2" />
                        </svg>
                    </div>
                </div>

                <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 gap-4 bg-slate-900">
                    <p>Jorge, presiona Activar para iniciar</p>
                </div>
            </div>

            <div class="flex flex-col gap-2 items-center">
                <div id="camera-controls" class="flex gap-4">
                    <button id="start-btn" class="bg-white text-slate-900 px-8 py-4 rounded-2xl font-bold shadow-xl">Activar Cámara</button>
                    <button id="capture-btn" class="hidden bg-emerald-500 text-white px-8 py-4 rounded-2xl font-bold shadow-lg">Capturar Documento</button>
                </div>
                <div id="edit-controls" class="hidden flex gap-3">
                    <button id="auto-detect-btn" class="bg-blue-600 text-white px-5 py-3 rounded-xl font-bold">Auto-Ajuste</button>
                    <button id="confirm-warp-btn" class="bg-emerald-500 text-white px-8 py-3 rounded-xl font-bold">Aplanar Página</button>
                    <button id="cancel-edit-btn" class="bg-slate-700 text-white px-5 py-3 rounded-xl font-bold">Descartar</button>
                </div>
            </div>
        </div>

        <div class="w-full md:w-80 flex flex-col gap-4">
            <div class="glass rounded-3xl p-6 flex flex-col gap-5 border border-slate-800">
                <input type="text" id="filename" value="Mi_Escaneo" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white outline-none">
                
                <div class="flex items-center justify-between p-3 bg-slate-900/50 rounded-xl">
                    <span class="text-xs font-bold">Documento B&N</span>
                    <input type="checkbox" id="filter-bw" class="w-5 h-5 accent-emerald-500">
                </div>

                <div id="thumbnail-grid" class="grid grid-cols-2 gap-2 max-h-40 overflow-y-auto"></div>

                <button id="generate-btn" disabled class="w-full bg-slate-800 text-slate-500 py-4 rounded-2xl font-bold cursor-not-allowed">Guardar PDF</button>
                <button id="reset-btn" class="text-xs font-bold text-rose-500 uppercase text-center">Borrar Todo</button>
            </div>
        </div>
    </main>

    <script>
        const { jsPDF } = window.jspdf;
        const video = document.getElementById('video');
        const editLayer = document.getElementById('edit-layer');
        const editCanvas = document.getElementById('edit-canvas');
        const canvasWrapper = document.getElementById('canvas-wrapper');
        const handlesContainer = document.getElementById('handles-container');
        const polyGuide = document.getElementById('poly-guide');
        const startBtn = document.getElementById('start-btn');
        const captureBtn = document.getElementById('capture-btn');
        const autoDetectBtn = document.getElementById('auto-detect-btn');
        const confirmWarpBtn = document.getElementById('confirm-warp-btn');
        const cancelEditBtn = document.getElementById('cancel-edit-btn');
        const generateBtn = document.getElementById('generate-btn');
        const thumbnailGrid = document.getElementById('thumbnail-grid');

        let pages = [];
        let stream = null;
        let capturedImage = null;
        let corners = []; 

        async function startCamera() {
            try {
                // Pedimos resolución muy alta para evitar el desenfoque
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "environment", 
                        width: { ideal: 4096 }, 
                        height: { ideal: 2160 } 
                    } 
                });
                video.srcObject = stream;
                document.getElementById('placeholder').classList.add('hidden');
                startBtn.classList.add('hidden');
                captureBtn.classList.remove('hidden');
                document.getElementById('scan-line').style.display = 'block';
            } catch (err) { alert("Error de cámara, Jorge. Revisa los permisos."); }
        }

        function captureToEdit() {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;
            const ctx = tempCanvas.getContext('2d', { alpha: false });
            ctx.drawImage(video, 0, 0);
            capturedImage = tempCanvas;
            showEditor();
        }

        function showEditor() {
            editLayer.classList.remove('hidden');
            document.getElementById('camera-controls').classList.add('hidden');
            document.getElementById('edit-controls').classList.remove('hidden');

            // Ajustamos el canvas de edición a la imagen capturada
            editCanvas.width = capturedImage.width;
            editCanvas.height = capturedImage.height;
            editCanvas.getContext('2d').drawImage(capturedImage, 0, 0);

            // Posicionamos los puntos inicialmente al 10% de los bordes
            const w = editCanvas.width;
            const h = editCanvas.height;
            corners = [
                { x: w*0.1, y: h*0.1 }, { x: w*0.9, y: h*0.1 },
                { x: w*0.9, y: h*0.9 }, { x: w*0.1, y: h*0.9 }
            ];
            renderUI();
        }

        function renderUI() {
            handlesContainer.innerHTML = '';
            // El truco está en usar el tamaño del canvas renderizado en pantalla
            const displayRect = editCanvas.getBoundingClientRect();
            const scaleX = displayRect.width / editCanvas.width;
            const scaleY = displayRect.height / editCanvas.height;

            let polyPoints = "";

            corners.forEach((c, i) => {
                const handle = document.createElement('div');
                handle.className = 'corner-handle';
                handle.style.left = `${c.x * scaleX}px`;
                handle.style.top = `${c.y * scaleY}px`;
                handle.style.pointerEvents = "auto";
                
                polyPoints += `${c.x * scaleX},${c.y * scaleY} `;

                const updatePos = (clientX, clientY) => {
                    const box = editCanvas.getBoundingClientRect();
                    // Mapeo preciso: restamos la posición del canvas y dividimos por la escala visual
                    c.x = Math.max(0, Math.min(editCanvas.width, (clientX - box.left) / scaleX));
                    c.y = Math.max(0, Math.min(editCanvas.height, (clientY - box.top) / scaleY));
                    renderUI();
                };

                // Soporte para PC y Móvil (Touch)
                handle.onmousedown = (e) => {
                    document.onmousemove = (me) => updatePos(me.clientX, me.clientY);
                    document.onmouseup = () => document.onmousemove = null;
                };

                handle.ontouchmove = (e) => {
                    const touch = e.touches[0];
                    updatePos(touch.clientX, touch.clientY);
                    e.preventDefault();
                };

                handlesContainer.appendChild(handle);
            });
            polyGuide.setAttribute('points', polyPoints);
        }

        function warpAndAdd() {
            // Calculamos dimensiones para un PDF nítido (Escala proporcional)
            const outW = 1200; 
            const outH = 1600; 
            
            const procCanvas = document.createElement('canvas');
            procCanvas.width = outW;
            procCanvas.height = outH;
            const ctx = procCanvas.getContext('2d', { alpha: false });

            // Recorte preciso basado en los 4 puntos
            // Nota: Para un aplanado perfecto usamos drawImage segmentado
            ctx.drawImage(capturedImage, 
                corners[0].x, corners[0].y, 
                corners[1].x - corners[0].x, corners[3].y - corners[0].y, 
                0, 0, outW, outH
            );

            if (document.getElementById('filter-bw').checked) {
                const imgData = ctx.getImageData(0,0, outW, outH);
                const d = imgData.data;
                for (let i=0; i<d.length; i+=4) {
                    const gray = d[i]*0.3 + d[i+1]*0.59 + d[i+2]*0.11;
                    const val = gray > 140 ? 255 : (gray < 70 ? 0 : gray);
                    d[i] = d[i+1] = d[i+2] = val;
                }
                ctx.putImageData(imgData, 0, 0);
            }

            pages.push({ data: procCanvas.toDataURL('image/jpeg', 0.95), w: outW, h: outH });
            closeEditor();
            updateThumbnails();
        }

        function closeEditor() {
            editLayer.classList.add('hidden');
            document.getElementById('camera-controls').classList.remove('hidden');
            document.getElementById('edit-controls').classList.add('hidden');
        }

        function updateThumbnails() {
            thumbnailGrid.innerHTML = '';
            pages.forEach(p => {
                const img = document.createElement('img');
                img.src = p.data;
                img.className = "w-full aspect-[3/4] object-cover rounded border border-slate-700";
                thumbnailGrid.appendChild(img);
            });
            document.getElementById('page-counter').innerText = `${pages.length} PÁGS`;
            generateBtn.disabled = pages.length === 0;
            generateBtn.className = pages.length > 0 ? "w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold" : "w-full bg-slate-800 text-slate-500 py-4 rounded-2xl font-bold cursor-not-allowed";
        }

        startBtn.onclick = startCamera;
        captureBtn.onclick = captureToEdit;
        confirmWarpBtn.onclick = warpAndAdd;
        cancelEditBtn.onclick = closeEditor;
        autoDetectBtn.onclick = () => {
            const w = editCanvas.width; const h = editCanvas.height;
            corners = [{x:w*0.02, y:h*0.02}, {x:w*0.98, y:h*0.02}, {x:w*0.98, y:h*0.98}, {x:w*0.02, y:h*0.98}];
            renderUI();
        };
        
        generateBtn.onclick = () => {
            const doc = new jsPDF('p', 'px', [pages[0].w, pages[0].h]);
            pages.forEach((p, i) => {
                if (i > 0) doc.addPage([p.w, p.h], 'p');
                doc.addImage(p.data, 'JPEG', 0, 0, p.w, p.h, null, 'FAST');
            });
            doc.save(`${document.getElementById('filename').value}.pdf`);
        };

        document.getElementById('reset-btn').onclick = () => { if(confirm("¿Jorge, borrar todo?")) { pages = []; updateThumbnails(); }};
        window.onresize = () => { if(!editLayer.classList.contains('hidden')) renderUI(); };
    </script>
</body>
</html>
